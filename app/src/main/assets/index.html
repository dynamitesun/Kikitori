<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kikitori</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar. Indigo ink on cool paper; yamabuki yellow marks "what you're hearing now". */
:root{
  --bg:#eceff4; --surface:#ffffff; --sunk:#e2e6ee; --ink:#1a2135; --muted:#596179; --line:#d3d8e2;
  --ai:#2a3f8f; --ai-ink:#ffffff; --hl:#f6c443; --hl-soft:#fbe7a8; --good:#2c7a4b; --bad:#b0412f;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131b; --surface:#191e2a; --sunk:#141823; --ink:#e5e8f0; --muted:#9aa2b8; --line:#2b3243;
  --ai:#8ea4ff; --ai-ink:#0f1320; --hl:#e3ac1d; --hl-soft:#4a3d17; --good:#5cc489; --bad:#f07e69; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131b; --surface:#191e2a; --sunk:#141823; --ink:#e5e8f0; --muted:#9aa2b8; --line:#2b3243;
  --ai:#8ea4ff; --ai-ink:#0f1320; --hl:#e3ac1d; --hl-soft:#4a3d17; --good:#5cc489; --bad:#f07e69; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
.meter{display:flex;gap:3px;align-items:flex-end;height:20px;margin-left:auto}
.meter i{width:4px;height:6px;background:var(--line);border-radius:2px;transition:height .2s}
.speaking .meter i{background:var(--hl);animation:bar .7s ease-in-out infinite alternate}
.speaking .meter i:nth-child(2){animation-delay:.15s}.speaking .meter i:nth-child(3){animation-delay:.3s}
.speaking .meter i:nth-child(4){animation-delay:.1s}.speaking .meter i:nth-child(5){animation-delay:.25s}
@keyframes bar{from{height:4px}to{height:20px}}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
main{padding-block:18px 170px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11px}
nav.tabs button b{font-size:18px;font-weight:700;line-height:1.2}
nav.tabs button[aria-current="true"]{color:var(--ai)}
nav.tabs button[aria-current="true"] b{color:var(--ink)}
nav.tabs .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-mono)}

h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.25}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.btn.big{padding:14px 20px;font-size:17px;width:100%}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);letter-spacing:.04em}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:14px;font-weight:700}
ruby rt{font-size:.5em;color:var(--muted);font-weight:500}
.nofuri rt{display:none}

/* today */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--f-mono);font-size:24px;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:transparent}
.plan li.done .check{background:var(--good);border-color:var(--good);color:#fff}
.plan .what{flex:1;min-width:0}
.plan .what b{display:block}
.plan .what span{font-size:13px;color:var(--muted)}
details.why summary{cursor:pointer;font-weight:700}
details.why ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.notice{border:1px solid var(--hl);background:var(--hl-soft);border-radius:12px;padding:12px 14px;font-size:14px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.item .jp{font-size:19px;font-weight:700;line-height:1.3}
.item .en{font-size:13px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.item .num{font-family:var(--f-mono);color:var(--muted);font-size:13px;width:22px}
.score{font-family:var(--f-mono);font-size:13px;color:var(--good)}

/* player */
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ai)}
.playbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--ai);color:var(--ai-ink);font-size:28px;display:grid;place-items:center;margin:4px auto}
.playbtn.stop{background:var(--hl);color:#1a1300}
.speedbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.q{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:15px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kw span{background:var(--sunk);border-radius:10px;padding:6px 10px;font-size:15px}
.kw small{color:var(--muted);margin-left:6px;font-size:12px}
.lines{display:flex;flex-direction:column;gap:2px}
.ln{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer}
.ln .sp{font-size:12px;color:var(--muted);font-weight:700;padding-top:6px}
.ln .t{font-size:19px;line-height:2;min-width:0;overflow-wrap:anywhere}
.ln .e{font-size:13px;color:var(--muted);line-height:1.5}
.ln.now{background:var(--hl-soft)}
.ln.turn{background:color-mix(in srgb,var(--ai) 14%,transparent)}
.hidden-script .ln .t{filter:blur(7px);user-select:none}
.rates{display:flex;gap:6px;margin-top:6px}
.rates button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.rates button[aria-pressed="true"][data-r="1"]{background:var(--good);border-color:var(--good);color:#fff}
.rates button[aria-pressed="true"][data-r="2"]{background:var(--hl);border-color:var(--hl);color:#1a1300}
.rates button[aria-pressed="true"][data-r="3"]{background:var(--bad);border-color:var(--bad);color:#fff}
.dict .sent{font-size:19px;line-height:1.8}
.dict .gap{display:inline-block;min-width:4em;border-bottom:2px solid var(--ai);margin:0 2px}
.dict input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:18px}
.fb{font-size:14px;font-weight:700}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.sticky-ctl{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;z-index:3}
.star{background:none;border:0;color:var(--muted);font-size:18px;padding:0 4px}
.star[aria-pressed="true"]{color:var(--hl)}
.big-jp{font-size:24px;line-height:2;text-align:center}
.center{text-align:center}
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;max-width:608px;margin:0 auto}
details.notes summary{cursor:pointer}
.ntable{display:flex;flex-direction:column;margin-top:10px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nsp{font-size:18px;font-weight:700;line-height:1.7}
.ntb{font-size:15px;color:var(--muted);align-self:center}
.ntb::before{content:"→ ";color:var(--ai)}
.nen{grid-column:1/-1;font-size:13px;color:var(--muted)}
.w{cursor:pointer;border-radius:4px;transition:background .15s}
.w:hover{background:color-mix(in srgb,var(--ai) 12%,transparent)}
.w.sel{background:var(--hl-soft);box-shadow:0 2px 0 var(--hl)}
.ln .sp{cursor:pointer}
.ln .sp::before{content:"▶ ";color:var(--ai);font-size:10px}
.lplay{background:none;border:0;color:var(--ai);font-size:13px;padding:8px 6px 0 0;align-self:start}
.gl-item{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.gl-item:first-of-type{border-top:0}
.gl-w{font-size:24px;font-weight:700;line-height:1.3}
.gl-r{font-size:14px;color:var(--muted);margin-left:8px;font-weight:500}
.gl-m{font-size:15px}
.gl-g{font-size:14px;color:var(--muted)}
.gl-credit{font-size:11px;color:var(--muted);margin-top:6px}
.diff{font-size:19px;line-height:1.9;overflow-wrap:anywhere}
.diff mark{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad);border-radius:3px;padding:0 1px}
.dict textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:18px;min-height:76px;resize:vertical;font-family:inherit;color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.now .t{font-size:22px;line-height:2;overflow-wrap:anywhere}
.now .hidden-txt{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;cursor:pointer}
.ctl{display:flex;gap:10px;justify-content:center;align-items:center}
.ctl button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px}
.ctl button.main{width:68px;height:68px;background:var(--ai);color:var(--ai-ink);border-color:var(--ai);font-size:24px}
.pick{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.pick:first-child{border-top:0}
.pick input{width:20px;height:20px;accent-color:var(--ai);flex:none}
.pick .grow{flex:1;min-width:0}
.pick .jp{font-weight:700}
.pick .en{font-size:13px;color:var(--muted)}
.mini{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:5}
.mini .bar{margin:0 auto;max-width:608px;margin-inline:max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px}
.mini .bar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mini button{background:none;border:0;color:inherit;font-size:16px;padding:6px 10px}
@media (prefers-reduced-motion: reduce){.speaking .meter i{animation:none;height:14px}}
</style>

</head><body>
<div id="root">
  <header class="top"><div class="wrap">
    <div class="brand">聞き取り<small>Kikitori · listening</small></div>
    <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <button class="iconbtn" data-act="settings" aria-label="Settings">⚙</button>
  </div></header>
  <main class="wrap" id="main"></main>
  <div id="minibar"></div>
  <nav class="tabs"><div class="wrap" id="tabs"></div></nav>
</div>
<div id="sheet"></div>

<script>
/* ===================== CONTENT ===================== */
const LESSONS=[
{id:"l1",jp:"週末の予定",en:"Weekend plans",reg:"Casual",sp:{A:"ゆき",B:"けん"},
 situation:"Two university friends, Yuki and Ken, talk after class about the weekend.",
 kw:[["[予定|よてい]","plans"],["[空|あ]いてる","free (casual)"],["[開店|かいてん]","store opening"],["[並|なら]ぶ","to line up"],["[集合|しゅうごう]","meet up"],["[置|お]いてく","leave behind"]],
 lines:[
 ["A","ねえ、[今週末|こんしゅうまつ]って[何|なに]か[予定|よてい]ある？","Hey, do you have any plans this weekend?"],
 ["B","うーん、[土曜|どよう]はバイトなんだけど、[日曜|にちよう]なら[空|あ]いてるよ。","Hmm, I work my part-time job on Saturday, but I'm free on Sunday."],
 ["A","じゃあさ、[日曜|にちよう]に[新|あたら]しくできたラーメン[屋|や][行|い]かない？[駅|えき]の[近|ちか]くの。","Then how about the new ramen place on Sunday? The one near the station."],
 ["B","あ、あそこ！[行|い]きたいと[思|おも]ってたんだ。でも、すごい[並|なら]んでるって[聞|き]いたけど。","Oh, that place! I've wanted to go. But I heard the line is huge."],
 ["A","そうなんだよね。だから[開店前|かいてんまえ]に[行|い]っとこうと[思|おも]って。[十一時|じゅういちじ][開店|かいてん]だから、[十時半|じゅうじはん][集合|しゅうごう]でどう？","Right. So I figured we'd go before it opens. It opens at eleven, so how about meeting at ten-thirty?"],
 ["B","[早|はや]っ。まあいいけど、[遅|おく]れちゃったらごめんね。","So early. Fine, but sorry in advance if I'm late."],
 ["A","[遅|おく]れたら[置|お]いてくからね。","If you're late, I'm leaving without you."],
 ["B","ひどっ！わかった、ちゃんと[起|お]きるよ。","Harsh! Okay, I'll get up properly."]],
 gist:{q:"What are they mainly arranging?",o:["Going to a new ramen shop on Sunday","Swapping B's work shift","Meeting at the station after work on Saturday","Cooking ramen at home together"]},
 detail:[
 {q:"Why does Yuki want to meet at 10:30?",o:["To arrive before the shop opens and the line builds","Because Ken works in the afternoon","Because the shop closes early","To catch a train"]},
 {q:"Why is Ken busy on Saturday?",o:["He has his part-time job","He has an exam","He's visiting family","He's going to the ramen shop"]},
 {q:"What will Yuki do if Ken is late?",o:["Go without him","Wait at the station","Call him","Pick another day"]}],
 dict:[{line:1,blank:"空いてる",ans:["空いてる","あいてる"]},{line:4,blank:"行っとこう",ans:["行っとこう","いっとこう"]},{line:5,blank:"遅れちゃったら",ans:["遅れちゃったら","おくれちゃったら"]}]},

{id:"l2",jp:"病院の受付",en:"At the clinic desk",reg:"Polite",sp:{A:"受付",B:"患者"},
 situation:"A patient walks into a neighborhood clinic for the first time and talks to the receptionist.",
 kw:[["[熱|ねつ]","fever"],["[喉|のど]","throat"],["[保険証|ほけんしょう]","insurance card"],["[問診票|もんしんひょう]","medical questionnaire"],["お[掛|か]けください","please sit"]],
 lines:[
 ["A","こんにちは。[今日|きょう]はどうされましたか。","Hello. What brings you in today?"],
 ["B","[昨日|きのう]の[夜|よる]から[熱|ねつ]があって、[喉|のど]もすごく[痛|いた]いんです。","I've had a fever since last night, and my throat really hurts."],
 ["A","そうですか。こちらは[初|はじ]めてですか。","I see. Is this your first visit here?"],
 ["B","はい、[初|はじ]めてです。","Yes, it's my first time."],
 ["A","では、[保険証|ほけんしょう]をお[預|あず]かりしてもよろしいでしょうか。それから、こちらの[問診票|もんしんひょう]にご[記入|きにゅう]ください。","Then may I take your insurance card? And please fill out this questionnaire."],
 ["B","わかりました。どのくらい[待|ま]ちますか。","Okay. How long will I wait?"],
 ["A","[今|いま]、[三人|さんにん]お[待|ま]ちなので、[三十分|さんじゅっぷん]ほどかかると[思|おも]います。","Three people are waiting, so it'll probably take about thirty minutes."],
 ["B","じゃあ、[書|か]き[終|お]わったらここに[出|だ]せばいいですか。","So when I'm done writing, I hand it in here?"],
 ["A","はい、こちらにお[願|ねが]いします。お[名前|なまえ]をお[呼|よ]びしますので、あちらでお[掛|か]けになってお[待|ま]ちください。","Yes, here please. We'll call your name, so please take a seat over there."]],
 gist:{q:"Why is the person at the clinic?",o:["Fever and sore throat, first visit","A follow-up on an injury","Picking up medicine","Booking for a friend"]},
 detail:[
 {q:"How long is the expected wait?",o:["About 30 minutes","About 3 minutes","About an hour","No wait"]},
 {q:"What does the receptionist ask for?",o:["The insurance card","Payment up front","A phone number","A referral letter"]},
 {q:"What should the patient do after filling in the form?",o:["Hand it in at the desk and sit down","Take it to the doctor's room","Mail it later","Fill in a second form"]}],

const CLIPS={"A|ねえ、今週末って何か予定ある？": "audio/7557a018a7.mp3", "B|うーん、土曜はバイトなんだけど、日曜なら空いてるよ。": "audio/4813e11db5.mp3", "A|じゃあさ、日曜に新しくできたラーメン屋行かない？駅の近くの。": "audio/3ee315d088.mp3", "B|あ、あそこ！行きたいと思ってたんだ。でも、すごい並んでるって聞いたけど。": "audio/4bf59ca048.mp3", "A|そうなんだよね。だから開店前に行っとこうと思って。十一時開店だから、十時半集合でどう？": "audio/0cbe744594.mp3", "B|早っ。まあいいけど、遅れちゃったらごめんね。": "audio/e7db36408c.mp3", "A|遅れたら置いてくからね。": "audio/20ce3a0afc.mp3", "B|ひどっ！わかった、ちゃんと起きるよ。": "audio/312e617603.mp3", "A|こんにちは。今日はどうされましたか。": "audio/6e2616472a.mp3", "B|昨日の夜から熱があって、喉もすごく痛いんです。": "audio/5a195a979f.mp3", "A|そうですか。こちらは初めてですか。": "audio/2a5757d1f9.mp3", "B|はい、初めてです。": "audio/3c000e7597.mp3", "A|では、保険証をお預かりしてもよろしいでしょうか。それから、こちらの問診票にご記入ください。": "audio/6a28fa2580.mp3", "B|わかりました。どのくらい待ちますか。": "audio/cc288f0f81.mp3", "A|今、三人お待ちなので、三十分ほどかかると思います。": "audio/35c283fc91.mp3", "B|じゃあ、書き終わったらここに出せばいいですか。": "audio/35db0e8714.mp3", "A|はい、こちらにお願いします。お名前をお呼びしますので、あちらでお掛けになってお待ちください。": "audio/5924a1b4cd.mp3", "A|課長、すみません。今、少しよろしいでしょうか。": "audio/54f0e69370.mp3", "B|うん、どうした？": "audio/d2efa731eb.mp3", "A|実は、昨日お送りした見積書の金額が間違っていまして…。": "audio/59a98713cc.mp3", "B|えっ、どこが？": "audio/a28dc86f9d.mp3", "A|単価を古いものにしてしまいまして、合計が五万円ほど安くなっていました。": "audio/18c231b0e2.mp3", "B|先方にはもう連絡した？": "audio/879e5356a0.mp3", "A|いえ、まだです。先にご報告しようと思いまして。": "audio/0069b30c8b.mp3", "B|そっか、報告してくれてよかった。じゃあ、すぐに訂正版を作って、お詫びのメールと一緒に送っておいて。": "audio/4674fa4bd0.mp3", "A|承知しました。本当に申し訳ありません。": "audio/93569f5f2c.mp3", "B|次から送る前にダブルチェックしようね。": "audio/77984691bd.mp3", "A|明日の天気です。台風十五号は、今夜遅くに九州南部に接近する見込みです。": "audio/aa38adeb42.mp3", "A|九州と四国では、明日の朝にかけて、非常に激しい雨が降るおそれがあります。": "audio/11414a15ba.mp3", "A|土砂災害や川の増水に十分注意してください。": "audio/56a11083fa.mp3", "A|関東地方は、明日の午前中は曇りですが、午後から次第に雨が降り出すでしょう。": "audio/84bffcf4d7.mp3", "A|最高気温は東京で二十三度と、今日より四度ほど低くなる見込みです。": "audio/9b95549578.mp3", "A|また、交通機関に遅れが出る可能性がありますので、お出かけの際は最新の情報をご確認ください。": "audio/0df1ef0825.mp3", "A|ねえ、来年の春に契約更新でしょ？そろそろ引っ越すかどうか決めないと。": "audio/3a7fec5c15.mp3", "B|そうだね。正直、今の部屋、駅から遠すぎて毎日しんどいんだよね。": "audio/efc48e33f6.mp3", "A|わかる。でも駅近にすると家賃がけっこう上がっちゃうよ。": "audio/632a8f4018.mp3", "B|二万くらいなら上がってもいいかなって思ってるんだけど。": "audio/6b1ff47741.mp3", "A|うーん、それなら広さを我慢するしかないかもね。": "audio/74255538fc.mp3", "B|狭いのは嫌だなあ。在宅の日もあるし、仕事部屋は欲しいんだよね。": "audio/bd25a62a53.mp3", "A|じゃあ、駅からちょっと離れてても、バス一本で行けるところは？": "audio/48bc4d8cd3.mp3", "B|ああ、それアリかも。バスなら座れるし。週末に不動産屋行ってみよっか。": "audio/75e770fdc0.mp3", "A|すみません、先週こちらで買ったイヤホンなんですけど、片方から音が出なくなってしまって。": "audio/7e086df633.mp3", "B|大変申し訳ございません。レシートはお持ちでしょうか。": "audio/1ce5c63730.mp3", "A|はい、これです。": "audio/eb4188d44b.mp3", "B|ありがとうございます。購入から一週間以内ですので、新しいものと交換させていただきます。": "audio/1a21bcdaa2.mp3", "A|あの、同じ商品じゃなくて、返金してもらうことってできますか。": "audio/70d79b045a.mp3", "B|申し訳ございませんが、初期不良の場合は、交換のみの対応となっております。": "audio/7f93746034.mp3", "A|そうなんですか…。じゃあ、色だけ変えてもらうことはできますか。": "audio/402de2f39e.mp3", "B|同じ商品でしたら、色の変更は可能です。少々お待ちください。": "audio/f480b1ac35.mp3", "A|駅前に、小さなコンビニがある。": "audio/0f75b00bbc.mp3", "A|そのコンビニには、一匹の猫が住んでいる。": "audio/c4a739c484.mp3", "A|名前はタマ。茶色くて、少し太っている。": "audio/35325ca24d.mp3", "A|タマは、毎朝レジの横で寝ている。": "audio/7514769039.mp3", "A|お客さんはみんな、タマに「おはよう」と声をかける。": "audio/04cfbf178a.mp3", "A|でもタマは、いつも目を開けない。": "audio/723058a967.mp3", "A|ある雨の日、小さな男の子が一人で店に入ってきた。": "audio/4652bed761.mp3", "A|男の子は泣いていた。お母さんとはぐれてしまったのだ。": "audio/e99e6fdec3.mp3", "A|すると、タマが急に起きて、男の子の足元に座った。": "audio/fb6bbf0348.mp3", "A|男の子はタマをなでているうちに、泣きやんだ。": "audio/2d2ee65829.mp3", "A|十分後、お母さんが走って店に入ってきた。": "audio/7334928525.mp3", "A|男の子は笑って、「猫が待っててくれたんだよ」と言った。": "audio/e299565f6d.mp3", "A|タマはまた、レジの横で目を閉じた。": "audio/197fd29017.mp3", "A|大学二年の夏、私は初めて一人で旅行に出かけた。": "audio/31ff8e2e2d.mp3", "A|行き先は、北海道の小さな町だった。": "audio/7bf42f2836.mp3", "A|飛行機を降りると、空気が東京よりずっと涼しかった。": "audio/a0df8021c3.mp3", "A|予約していた宿は、駅から歩いて二十分のところにあった。": "audio/14aa269502.mp3", "A|宿のおばあさんは、とても優しい人だった。": "audio/0ab30f4740.mp3", "A|「夕飯は六時だからね」と言って、部屋に案内してくれた。": "audio/e97591e583.mp3", "A|夕飯には、その日の朝にとれた魚が出てきた。": "audio/40882c8fd5.mp3", "A|こんなにおいしい魚を食べたのは、生まれて初めてだった。": "audio/6f0cf2a25d.mp3", "A|次の日、私は自転車を借りて、湖まで走った。": "audio/4a5a6c07a4.mp3", "A|途中で道に迷ったけれど、地元の人が親切に教えてくれた。": "audio/6efeefa719.mp3", "A|湖に着いたとき、水がまるで鏡のように空を映していた。": "audio/fb178dd3c2.mp3", "A|一人旅は少し寂しいと思っていたけれど、実際はたくさんの人と話した旅だった。": "audio/7619311fe4.mp3", "A|私の祖母は、料理がとても上手だった。": "audio/2c6e7dc9ef.mp3", "A|中でも一番好きだったのは、祖母のカレーだ。": "audio/28d524d29d.mp3", "A|祖母のカレーには、りんごとはちみつが入っていて、少し甘かった。": "audio/c08c2922f5.mp3", "A|子どもの頃、私は週末になると祖母の家に遊びに行った。": "audio/e9a99b6161.mp3", "A|台所からいい匂いがしてくると、「今日はカレーだ」とすぐにわかった。": "audio/9f34a04f9a.mp3", "A|祖母が亡くなってから、あの味をもう一度食べたいと何度も思った。": "audio/53993de13b.mp3", "A|でも、レシピはどこにも書いていなかった。": "audio/04a501c936.mp3", "A|去年、母と二人で、祖母のカレーを作ってみることにした。": "audio/3896e3fd98.mp3", "A|何回作っても、なかなか同じ味にならなかった。": "audio/8ab2c22b20.mp3", "A|五回目に、母が「隠し味にしょうゆを入れていたかも」と言い出した。": "audio/78906996b8.mp3", "A|少しだけしょうゆを入れてみると、懐かしい味がした。": "audio/ac61ac8864.mp3", "A|私たちは台所で、顔を見合わせて笑った。": "audio/a290883783.mp3", "A|叔母さん": "audio/2c52fb70b7.mp3", "A|お婆さん": "audio/88de64f332.mp3", "A|病院": "audio/d575a5f779.mp3", "A|美容院": "audio/548f14b702.mp3", "A|来て": "audio/e83b44d1cd.mp3", "A|切手": "audio/430b45db58.mp3", "A|主人": "audio/3fc7c83484.mp3", "A|囚人": "audio/d37c3d0c3a.mp3", "A|坂": "audio/50b3d1bf1e.mp3", "A|作家": "audio/311f3721a5.mp3", "A|雪": "audio/bc285f99fe.mp3", "A|勇気": "audio/87ce51622b.mp3", "A|いえ": "audio/77f62fd7bf.mp3", "A|いいえ": "audio/dfb1eb0756.mp3", "A|過去": "audio/0f33480d5f.mp3", "A|加工": "audio/c58d4d67a5.mp3", "A|予約": "audio/e2b97bbf0e.mp3", "A|ようやく": "audio/c7309b4bd8.mp3", "A|音": "audio/598b2cbc36.mp3", "A|夫": "audio/20c47d5501.mp3", "A|取る": "audio/efa8dfa314.mp3", "A|通る": "audio/3d7512407c.mp3", "A|世界": "audio/cee507b261.mp3", "A|正解": "audio/858c9cec3a.mp3", "A|鯛": "audio/ba77c05a20.mp3", "A|単位": "audio/432469229e.mp3", "A|来た": "audio/27b5f59d98.mp3", "A|切った": "audio/5cc7c04f09.mp3", "A|宿題、まだやってないの？": "audio/c872bcaafa.mp3", "A|もう全部食べちゃった。": "audio/71f1baaa94.mp3", "A|明日早いから、もう寝なきゃ。": "audio/6f85f9f560.mp3", "A|資料、机の上に置いといたよ。": "audio/21cbfc531e.mp3", "A|ちょっとそこで待ってて。": "audio/82a045d9cf.mp3", "A|雨降りそうだから、傘持ってったほうがいいよ。": "audio/9851928134.mp3", "A|それ、言っちゃだめだよ。": "audio/2484505c82.mp3", "A|何言ってんの？": "audio/3b1790770c.mp3", "A|先週も同じこと言ってたじゃん。": "audio/7d7a6a2e32.mp3", "A|昨日ちょっと飲みすぎちゃった。": "audio/06361cdbf7.mp3", "A|終電あるから、早く帰んなきゃ。": "audio/18d169a48b.mp3", "A|これ、どうすりゃいいの？": "audio/cdd16963a1.mp3", "A|そんなの知らないってば。": "audio/acec36b26c.mp3", "A|来週の飲み会、行けたら行くね。": "audio/b59afd6339.mp3", "A|こんにちは。今日も聞き取りの練習をしましょう。": "audio/6628746c8a.mp3", "B|はい、がんばります。": "audio/74da6a637f.mp3", "A|こちら、3410円になります。": "audio/a124bd398c.mp3", "A|こちら、9800円になります。": "audio/857638f6f2.mp3", "A|こちら、1640円になります。": "audio/79425f1c72.mp3", "A|こちら、4140円になります。": "audio/4722ac7afe.mp3", "A|こちら、6760円になります。": "audio/a6fd9c9517.mp3", "A|こちら、590円になります。": "audio/0da750bc8f.mp3", "A|こちら、840円になります。": "audio/b0e07a581f.mp3", "A|こちら、8500円になります。": "audio/f0c1dd9d60.mp3", "A|こちら、5580円になります。": "audio/36b5019f4a.mp3", "A|こちら、1060円になります。": "audio/d4e36866cb.mp3", "A|こちら、3840円になります。": "audio/426ee69ef3.mp3", "A|こちら、6060円になります。": "audio/cfa31ac89e.mp3", "A|会議は午後1時45分からです。": "audio/f48533591d.mp3", "A|会議は午後2時半からです。": "audio/39332d482f.mp3", "A|会議は午後9時30分からです。": "audio/133c8ba1d7.mp3", "A|会議は午前4時55分からです。": "audio/357ce3beae.mp3", "A|会議は午前1時50分からです。": "audio/aec784d19f.mp3", "A|会議は午後1時15分からです。": "audio/cdd2d14186.mp3", "A|会議は午後3時20分からです。": "audio/fc8025ba30.mp3", "A|会議は午前9時5分からです。": "audio/3c9005cc47.mp3", "A|会議は午後9時55分からです。": "audio/d1ca4592d6.mp3", "A|会議は午前10時50分からです。": "audio/0983e9b378.mp3", "A|会議は午前6時5分からです。": "audio/32e7193a9f.mp3", "A|会議は午後2時50分からです。": "audio/25ce60240e.mp3", "A|締め切りは4月20日です。": "audio/24d2e37842.mp3", "A|締め切りは11月28日です。": "audio/e00aee5b8b.mp3", "A|締め切りは6月8日です。": "audio/34ee13a86e.mp3", "A|締め切りは10月8日です。": "audio/b99f5d2d09.mp3", "A|締め切りは6月20日です。": "audio/96fe7fe2c0.mp3", "A|締め切りは4月12日です。": "audio/8b84d62fd7.mp3", "A|締め切りは12月16日です。": "audio/3898c14bbd.mp3", "A|締め切りは2月20日です。": "audio/f4688e9c01.mp3", "A|締め切りは9月20日です。": "audio/0d2a88de1d.mp3", "A|締め切りは6月1日です。": "audio/125236809b.mp3", "A|締め切りは5月5日です。": "audio/570aae93ae.mp3", "A|学生が7人います。": "audio/977249bf96.mp3", "A|ペンを3本ください。": "audio/3c90984df5.mp3", "A|切手を6枚ください。": "audio/23f4936c60.mp3", "A|ビールを3杯お願いします。": "audio/9105de50af.mp3", "A|猫が8匹います。": "audio/52d526f1e9.mp3", "A|本を7冊借りました。": "audio/7468c344e1.mp3", "A|学生が1人います。": "audio/2f8a629b41.mp3", "A|ペンを2本ください。": "audio/c515035b11.mp3", "A|切手を9枚ください。": "audio/aa972ba1b3.mp3", "A|ビールを10杯お願いします。": "audio/129da64806.mp3", "A|猫が6匹います。": "audio/2b8b264548.mp3", "A|本を6冊借りました。": "audio/dc1b4599bf.mp3", "A|ねえ聞いて、ライブのチケット当たったんだけど！": "audio/05142a6f29.mp3", "B|え、マジで？あの倍率で？": "audio/3d54df7ec8.mp3", "A|ガチ。昨日の夜メール来てさ、二度見したもん。": "audio/dab6f6ccee.mp3", "B|すげー。で、いつだっけ？": "audio/96956472d9.mp3", "A|来月の十四日。土曜だから行けるっしょ？": "audio/16af8bd5b0.mp3", "B|あー、その日バイト入ってたかも…ちょっと待って、確認する。": "audio/ad57ea4d3b.mp3", "A|もし無理だったら、他の人誘うけど。": "audio/c687eba41e.mp3", "B|いや待って待って、代わってもらえないか聞いてみるわ。": "audio/0660157753.mp3", "A|ワンチャンいける？": "audio/f074eb51ca.mp3", "B|店長次第かな。まあ、なんとかする。": "audio/9edfbfbd21.mp3", "A|りょーかい。チケット代は後でいいからね。": "audio/63d7262fe5.mp3", "B|助かる。てか、グッズも買うっしょ？早めに並ばないとやばいらしいよ。": "audio/f209ba62f1.mp3", "A|おはよ…ってか、もう昼じゃん。": "audio/064c1b4d22.mp3", "B|うわ、頭痛っ…昨日何時に帰ってきたっけ？": "audio/f1615a77bb.mp3", "A|二時過ぎ。玄関でめっちゃうるさかったよ。": "audio/2f972bab31.mp3", "B|マジか、ごめん。全然覚えてないわ。": "audio/8c476fc4d4.mp3", "A|鍵どこ置いたかわかんないって、十分くらい探してたし。": "audio/d039b9cb6b.mp3", "B|え、で、鍵あった？": "audio/e09094d110.mp3", "A|ポケットに入ってた。最初からね。": "audio/b3473bd8a9.mp3", "B|うわー、恥ずかし。もう飲みすぎないって決めたのに。": "audio/72c902273e.mp3", "A|それ先月も言ってたじゃん。": "audio/dd4e9462db.mp3", "B|…それな。とりあえず水ちょうだい。": "audio/72383e67a1.mp3", "A|自分で取りなよ。あ、財布はテーブルの上に置いといたから。": "audio/cb0bed46b0.mp3", "A|はあ…今日のバイト、マジで最悪だった。": "audio/1f6fc0ee0c.mp3", "B|どしたの？": "audio/ee5a1cc952.mp3", "A|なんかさ、レジでめっちゃキレてくるお客さんがいてさ。": "audio/f0c5872788.mp3", "B|うわ、だる。何があったの？": "audio/e8713947f7.mp3", "A|ポイントカード忘れたのに、ポイントつけろってずっと言われて。": "audio/4b7ebcd4ce.mp3", "B|え、それ無理じゃん。": "audio/08e8b44cf7.mp3", "A|でしょ？で、店長呼んだら、店長もペコペコしちゃってさ。結局つけたんだよね。": "audio/d4c744c280.mp3", "B|えー、それはモヤるわ。": "audio/e69464c5f4.mp3", "A|ほんとそれ。てか、もう辞めよっかなって思ってる。": "audio/594a4865d1.mp3", "B|いやいや、時給いいって言ってたじゃん。": "audio/c536f4948b.mp3", "A|そうなんだけどさー。ストレスと割に合わないっていうか。": "audio/ce5d1278d4.mp3", "B|まあ、とりあえず今日は甘いもんでも食べな。": "audio/8017ce5bd3.mp3", "A|週末なんか予定ある？": "audio/dbd31f06d9.mp3", "B|特にないけど。なんで？": "audio/dd0f4ec684.mp3", "A|いや、天気よさそうだし、どっか行きたいなーみたいな。": "audio/2849cca87c.mp3", "B|いいじゃん。海とか？": "audio/431456f64d.mp3", "A|海はまだ寒くない？もうちょっと街っぽいとこがいいかも。": "audio/2b936e5f90.mp3", "B|じゃあ、横浜とかは？中華街で食べ歩き的な。": "audio/2b53e65ad6.mp3", "A|あ、それアリ！小籠包食べたい。": "audio/9fb439bf3b.mp3", "B|決まりね。何時集合にする？": "audio/bcd7404d67.mp3", "A|朝弱いから、昼ぐらいがいいな。": "audio/a6d2797dbf.mp3", "B|りょーかい。じゃあ十二時に駅の改札で。": "audio/5eb7284fee.mp3", "A|おけ。あ、でも雨降ったらどうする？": "audio/ce71dc2cf0.mp3", "B|そんときはそんときで考えよ。": "audio/923238da4d.mp3", "A|え、だいき？うそ、久しぶり！": "audio/50cd3c0147.mp3", "B|うわ、はるかじゃん！何年ぶり？": "audio/2928a25734.mp3", "A|高校卒業してからだから…五年？": "audio/3a1b95cff8.mp3", "B|マジか、そんな経つ？全然変わってないね。": "audio/772523ca50.mp3", "A|いやいや、だいきこそ。今何してるんだっけ？": "audio/d22fbf88f6.mp3", "B|今は東京で働いてる。IT系の会社。こっちには親の顔見に帰ってきた感じ。": "audio/f55b9225ee.mp3", "A|へえ、すごいじゃん。私はずっと地元。保育士やってる。": "audio/3babae8aba.mp3", "B|あー、昔から子ども好きだったもんね。": "audio/932f8c8293.mp3", "A|覚えてたんだ。ねえ、せっかくだしLINE交換しよ。": "audio/902040fc68.mp3", "B|もちろん。今度みんなで集まろうよ。": "audio/64af054be1.mp3", "A|いいね！じゃあグループ作っとくね。": "audio/f9deb490f9.mp3", "A|金曜の夜、会社の飲み会が思ったより長引いた。": "audio/bab2598e9d.mp3", "A|気づいたら、もう十二時半。終電はとっくに出ちゃってた。": "audio/2c54246efe.mp3", "A|タクシーで帰ると、たぶん八千円くらいかかる。": "audio/8f31da73cd.mp3", "A|正直、そんなお金は払いたくない。": "audio/1862c50f10.mp3", "A|で、駅前のネットカフェに泊まることにした。": "audio/8710916e75.mp3", "A|ネットカフェなんて、学生のとき以来だ。": "audio/b14ef89b15.mp3", "A|狭い個室だけど、シャワーもあるし、ドリンクも飲み放題。": "audio/79ec827ccc.mp3", "A|気づいたら、昔読んでた漫画を一気読みしてた。": "audio/3363f45319.mp3", "A|結局、寝たのは朝の四時。": "audio/cea72b25a4.mp3", "A|始発で帰って、家に着いたのは六時前だった。": "audio/87fb7bf9fb.mp3", "A|体はだるいけど、なんか楽しかったな。": "audio/8dfe6c2755.mp3", "A|…いや、やっぱり次はちゃんと終電で帰ろう。": "audio/94825345c7.mp3", "A|私には、推しがいる。": "audio/fa42786034.mp3", "A|五人組のアイドルグループの、一番背が低いメンバーだ。": "audio/12fabb1e7c.mp3", "A|きっかけは、去年たまたま見た動画だった。": "audio/d5aef4f388.mp3", "A|ダンスはそんなに上手じゃないのに、なんか目が離せなかった。": "audio/fa6c6a2653.mp3", "A|それから毎日、仕事の帰りに動画を見るようになった。": "audio/0be40cff5d.mp3", "A|推しができてから、生活がちょっと変わった。": "audio/6060545b8a.mp3", "A|ライブに行くために節約するようになったし、": "audio/72c7714726.mp3", "A|推しが好きだって言ってた本も読んでみた。": "audio/f58eadc10e.mp3", "A|友達には「ハマりすぎじゃない？」って笑われる。": "audio/07ebe90c8a.mp3", "A|でも、推しががんばってる姿を見ると、私もがんばろうって思えるんだよね。": "audio/4293654bd6.mp3", "A|来月、初めて握手会に行く予定。": "audio/9cc60d43fb.mp3", "A|何を話すか、今から考えすぎて眠れない。": "audio/4b75ffe339.mp3", "A|今日から、東京で一人暮らしが始まった。": "audio/16708ad5d8.mp3", "A|部屋は六畳のワンルーム。思ってたより狭い。": "audio/3b70f78bd2.mp3", "A|でも、窓からちょっとだけスカイツリーが見える。それだけでテンション上がる。": "audio/2236369d17.mp3", "A|段ボールを開けてたら、母からの手紙が出てきた。": "audio/8d68c30818.mp3", "A|「ちゃんとご飯食べてね」って、それだけ。": "audio/7ac75a0e03.mp3", "A|なんか急に、泣きそうになった。": "audio/2b10a72cfa.mp3", "A|夜ご飯はコンビニのお弁当。レンジがまだないから、店で温めてもらった。": "audio/8eefa1b220.mp3", "A|一人で食べるご飯って、こんなに静かなんだ。": "audio/29c3a5ed4e.mp3", "A|とりあえず、母に「着いたよ、部屋いい感じ」ってLINEした。": "audio/c9e29e769d.mp3", "A|すぐに、スタンプが三つ返ってきた。": "audio/0744d25926.mp3", "A|明日は、近くのスーパーと、安いカーテンを探しに行こう。": "audio/691253de0d.mp3", "A|不安もあるけど、ちょっとだけワクワクしてる。": "audio/9a00412b26.mp3", "A|部屋を片付けてたら、着てない服が山ほど出てきた。": "audio/6137c16ac4.mp3", "A|捨てるのももったいないし、フリマアプリで売ってみることにした。": "audio/178daa4b8f.mp3", "A|写真を撮って、説明を書いて、値段をつける。思ったより簡単だった。": "audio/9100e66a7f.mp3", "A|一番最初に売れたのは、一回しか着てないワンピース。": "audio/1cd65b2fe4.mp3", "A|出品して十分で「購入されました」って通知が来て、びっくりした。": "audio/91127aee49.mp3", "A|でも、そこからが大変だった。": "audio/486e417884.mp3", "A|梱包の仕方がわからなくて、ネットで調べまくった。": "audio/87a0066016.mp3", "A|コンビニで発送するのも初めてで、店員さんに何回も聞いちゃった。": "audio/c0a8f97835.mp3", "A|二日後、買った人から「きれいな状態でうれしいです」ってメッセージが来た。": "audio/41f49d4c7f.mp3", "A|それ読んだら、なんかめっちゃうれしくなった。": "audio/0c44c89ea1.mp3", "A|結局、一か月で十着売れて、一万円ちょっとになった。": "audio/867f9a3c8e.mp3", "A|そのお金で何買ったかって？…新しい服。また部屋が狭くなった。": "audio/6d65a88442.mp3", "A|週末どっか行かない？": "audio/16bf03296d.mp3", "A|何言ってるか全然わかんない。": "audio/09ccb6fd58.mp3", "A|もうバイト辞めよっかな。": "audio/752d41e10d.mp3", "A|明日、行けるっしょ？": "audio/ac8576305d.mp3", "A|どしたの？元気ないじゃん。": "audio/7ac82dcd57.mp3", "A|そんときはそんときで考えよ。": "audio/b22e41bf5b.mp3", "A|それ、先月も言ってたじゃん。": "audio/098936bf95.mp3", "A|チケット代は後で払っとくね。": "audio/6db9fe2355.mp3", "B|リュウジくん、ちょっといいっすか！": "audio/4f3962be64.mp3", "A|あ？なんだよ、うっせーな。今食ってんだろ。": "audio/670fcf37ac.mp3", "B|さっき駅前で、南高のやつにガン飛ばされたんすよ。": "audio/8b4dea602f.mp3", "A|はあ？で、おめー何も言わねーで帰ってきたのかよ。": "audio/238e3d3566.mp3", "B|いや、向こう三人いたんで…": "audio/fa54f09534.mp3", "A|だっせーな。なめられてんじゃねーよ。": "audio/6942e345e8.mp3", "B|でも、あいつら、リュウジくんのことも知らねーって言ってたっすよ。": "audio/aaed5921ec.mp3", "A|…あ？今なんつった？": "audio/d77cfa0472.mp3", "B|だから、リュウジくんなんか知らねーって。": "audio/45385ec298.mp3", "A|上等じゃねーか。明日、南高のやつら呼び出しとけ。": "audio/de89c4ac17.mp3", "B|マジっすか。ケンカっすか？": "audio/52554d3196.mp3", "A|バーカ、話つけるだけだっつーの。先に手出したほうが負けなんだよ。": "audio/0b66660a16.mp3", "A|テツ、ワレ、昨日何さらしとったんじゃ。": "audio/9254a89c08.mp3", "B|す、すんません、兄貴！": "audio/39c836e7a6.mp3", "A|すんませんで済むか、ボケ。よそのシマで暴れよって。": "audio/61369cede7.mp3", "B|あいつらが先に絡んできたんですわ。": "audio/e96a13d1df.mp3", "A|そんなもん関係あらへん。向こうの組から、もう電話来とんねん。": "audio/16bcd0c969.mp3", "B|ほんまですか…。": "audio/85ae6f1534.mp3", "A|ほんまや。オヤジの顔に泥塗ったんやぞ。わかっとんのか。": "audio/d56f63c9cb.mp3", "B|…はい。どないしたらええですか。": "audio/4655547853.mp3", "A|筋は通さなあかん。明日、わしと一緒に向こうへ頭下げに行くんや。": "audio/852e3f910e.mp3", "B|兄貴も来てくれはるんですか。": "audio/2db9bf2c45.mp3", "A|アホ。舎弟の不始末は兄貴の責任や。次やったら、ほんまにしばくぞ。": "audio/a9df568bd2.mp3", "B|親分、えらいことになりました。キヨシが山岡組に寝返りよったんです。": "audio/30b4d65f8b.mp3", "A|なんじゃと？キヨシが？": "audio/0a363156c5.mp3", "B|昨日の晩、山岡の事務所に入りよるとこ、見たもんがおるんです。": "audio/8580d757c7.mp3", "A|あの外道が…。わしがどれだけ面倒見てやった思うとるんじゃ。": "audio/0e95e6aa50.mp3", "B|どうしますか。若いもんは、みんな頭に来とります。": "audio/a64f647f07.mp3", "A|待て。今動いたら、向こうの思うつぼじゃけえ。": "audio/d79b743936.mp3", "B|ほいじゃが、このまま黙っとったら、なめられますけえ。": "audio/6ed9f2ce43.mp3", "A|わかっとる。ぶち腹が立っとるんは、わしも同じじゃ。": "audio/ab51b4a461.mp3", "A|じゃが、喧嘩は勝てる時にするもんじゃ。しばらくは様子見じゃのう。": "audio/42ccead36a.mp3", "B|…わかりました。若いもんには、よう言うて聞かせます。": "audio/11f343082d.mp3", "A|おう。それと、キヨシのおふくろには、今まで通り金届けちゃれ。あいつの親に罪はないけえのう。": "audio/1c8a399a79.mp3", "B|ちわっす！": "audio/30f97445ca.mp3", "A|おう。今日遅かったな。": "audio/fb78cd7cc1.mp3", "B|さーせん！補習が長引いちゃって。": "audio/522662fdb6.mp3", "A|別にいいけど。監督、今日機嫌悪いから気ぃつけろよ。": "audio/578a670485.mp3", "B|マジっすか。なんかあったんすか？": "audio/a355080403.mp3", "A|昨日の練習試合、ボロ負けだったじゃん。": "audio/fbf9165a50.mp3", "B|あー…そっすね。自分、エラー三つもしちゃったんで…": "audio/4d9e6ba201.mp3", "A|まあ、気にすんなって。次取り返しゃいいんだよ。": "audio/5a5f2b3eee.mp3", "B|うっす！あざっす！": "audio/f1de808327.mp3", "A|あ、そうだ。帰り、ラーメン行くけど来る？おごるよ。": "audio/e2a4037d76.mp3", "B|マジっすか！ゴチになります！": "audio/2571271759.mp3", "A|その代わり、グラウンド整備、一人でよろしくな。": "audio/0a7e0aaecb.mp3", "B|…うっす。": "audio/7253a4ea29.mp3", "B|よっしゃ、もう一軒行こーぜ、一軒！": "audio/82e96a0c88.mp3", "A|行かないって。あんた明日朝早いんでしょ。": "audio/6316b416a7.mp3", "B|早ーけど、関係ねーし。まだ全然酔ってねーもん。": "audio/5f729eb9b5.mp3", "A|酔ってる人はみんなそう言うの。ほら、真っすぐ歩けてないじゃん。": "audio/5750c9a790.mp3", "B|いや、これわざとだし。てか、ここどこだっけ？": "audio/364fd25284.mp3", "A|駅の近く。終電まであと十分しかないよ。": "audio/454abec858.mp3", "B|マジか。そりゃやっべーな。": "audio/22394a2dd8.mp3", "A|だから言ってんじゃん。さっきから何回も。": "audio/7aaa0b2304.mp3", "B|そんなん言ってたっけ？わりー、全然聞いてなかったわ。": "audio/2f9431b8f4.mp3", "A|でしょうね。ほら、駅まで送ってくから。": "audio/066773998c.mp3", "B|しゃーねーなー、帰るかー。わりーな、ほんっと。": "audio/cbe2742fde.mp3", "A|はいはい。明日、起きらんなかったら知らないからね。": "audio/c564e16b81.mp3", "A|おう、見習い！いつまで寝てやがんでえ。": "audio/c950186d8b.mp3", "B|す、すみません！今行きます！": "audio/cc89f77969.mp3", "A|河岸が閉まっちまうぞ。さっさと支度しな。": "audio/2b8023b42f.mp3", "B|はい！あの、親方、今日は何を仕入れるんですか。": "audio/5568b29521.mp3", "A|今日は寒いから、いいシラメが入ってるはずでえ。": "audio/8c820d9501.mp3", "B|シラメ…ですか？": "audio/dc37063ec1.mp3", "A|なんでえ、そのツラは。シラメだよ、シラメ！魚の。": "audio/7628623d12.mp3", "B|あ…ヒラメのことですね。": "audio/01ef0ff463.mp3", "A|てやんでえ、だからそう言ってんじゃねえか。江戸っ子はな、細けえことは気にしねえんだよ。": "audio/cb81bbfc8e.mp3", "B|は、はい。あと、大根も買いますか？": "audio/c79562c2e8.mp3", "A|おう、でえこんも忘れんなよ。値切るのは俺の仕事でえ。": "audio/37779d53fc.mp3", "A|ほら、ぼやぼやすんな。行くぜ！": "audio/b450d709dd.mp3", "A|うっせーな、静かにしろよ。": "audio/fc81664106.mp3", "A|おめー、何やってんだよ。": "audio/bf95a975b2.mp3", "A|今なんつった？": "audio/7d2b28613a.mp3", "A|だから行かねーっつってんだろ。": "audio/1f2a4ad3da.mp3", "A|そりゃねーよ。": "audio/4771022d02.mp3", "A|しゃーねーな、手伝ってやるよ。": "audio/8c8a04ac24.mp3", "A|マジっすか？": "audio/30f5cc29f0.mp3", "A|さーせん、遅れました。": "audio/061ac02721.mp3", "A|こまけーことは気にすんな。": "audio/eb6b931c32.mp3", "A|何さらしとんじゃ。": "audio/c51c0a6acc.mp3", "A|そんなもん関係あらへん。": "audio/06e62f6f8a.mp3", "A|わかっとんのか。": "audio/b1d3493de9.mp3", "A|黙っとったら、なめられるけえ。": "audio/3b7c59e3cd.mp3", "A|ちょっと待っとれ。": "audio/00af9afbde.mp3", "A|やっちまったな。": "audio/1036d0e7d1.mp3", "A|気ぃつけろよ。": "audio/5e9cac9d12.mp3", "A|次、取り返しゃいいんだよ。": "audio/fa23addef9.mp3", "A|今日はさみーな。": "audio/b6408476fc.mp3"};

const KEY="kikitori.v1";
const DEF={done:{},review:{},trouble:{},days:{},settings:{speed:0.9,voice:"",furi:true},drills:{}};
let S;
try{S=Object.assign(structuredClone(DEF),JSON.parse(localStorage.getItem(KEY)||"{}"));S.settings=Object.assign({},DEF.settings,S.settings||{})}catch(e){S=structuredClone(DEF)}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},200)}
function dkey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){const k=dkey();if(!S.days[k])S.days[k]={ms:0,tasks:{}};return S.days[k]}
function markTask(t){today().tasks[t]=true;save()}
function addMs(ms){if(ms>0&&ms<120000){today().ms+=ms;save()}}
function streak(){let n=0;const d=new Date();if(!active(dkey(d)))d.setDate(d.getDate()-1);
  while(active(dkey(d))){n++;d.setDate(d.getDate()-1)}return n}
function active(k){const x=S.days[k];return x&&(x.ms>30000||Object.keys(x.tasks).length>0)}

/* ===================== HELPERS ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RB=/\[([^|\]]+)\|([^\]]+)\]/g;
const rb=s=>esc(s).replace(RB,"<ruby>$1<rt>$2</rt></ruby>");
const plain=s=>s.replace(RB,"$1");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LMAP=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const SMAP=Object.fromEntries(STORIES.map(s=>[s.id,s]));
function kata2hira(s){return s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))}
function norm(s){return kata2hira(String(s).normalize("NFKC")).replace(/[\s、。！？!?,.・「」（）()]/g,"")}
function srcLines(src){
  if(LMAP[src]){const L=LMAP[src];return L.lines.map((x,i)=>({key:src+":"+i,sp:x[0],who:L.sp[x[0]],t:x[1],e:x[2]}))}
  const St=SMAP[src];return St.lines.map((x,i)=>({key:src+":"+i,sp:"A",who:"",t:x[0],e:x[1]}))}
function lineByKey(k){const [src,i]=k.split(":");if(!LMAP[src]&&!SMAP[src])return null;return srcLines(src)[+i]}
function srcName(src){const x=LMAP[src]||SMAP[src];return x?x.jp:""}

  async seq(items,opt={}){
    this.stop();const my=++this.tok;this.setBusy(true);

        if(my!==this.tok)return false;

function rubySegs(ruby){const out=[];let pos=0,last=0,m;const re=/\[([^|\]]+)\|([^\]]+)\]/g;
  while((m=re.exec(ruby))){for(const c of ruby.slice(last,m.index)){out.push([pos,pos+1,esc(c)]);pos++}
    out.push([pos,pos+m[1].length,`<ruby>${esc(m[1])}<rt>${esc(m[2])}</rt></ruby>`]);pos+=m[1].length;last=m.index+m[0].length}
  for(const c of ruby.slice(last)){out.push([pos,pos+1,esc(c)]);pos++}return out}
function rbw(key,ruby){const toks=DICT.l[key];if(!toks)return rb(ruby);const sg=rubySegs(ruby);const n=sg.length?sg[sg.length-1][1]:0;
  const cut=new Set([0,n]);toks.forEach(t=>{cut.add(t[0]);cut.add(t[1])});
  sg.forEach(g=>{for(const c of [...cut])if(c>g[0]&&c<g[1])cut.delete(c)});
  const pts=[...cut].sort((a,b)=>a-b);let html="";
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const inner=sg.filter(g=>g[0]>=a&&g[1]<=b).map(g=>g[2]).join("");
    const ids=toks.filter(t=>t[0]>=a&&t[1]<=b).map(t=>t[2]);
    html+=ids.length?`<span class="w" data-act="gloss" data-gl="${ids.join(",")}">${inner}</span>`:inner}
  return html}
function openGloss(el){document.querySelectorAll(".w.sel").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");
  const ids=el.dataset.gl.split(",").map(Number);sheetOpen=true;
  $("#sheet").innerHTML=`<div class="sheet" data-act="closeSheet"><div class="panel" role="dialog" aria-label="Word meaning" onclick="event.stopPropagation()">
  ${ids.map(id=>{const [w,r,g]=DICT.e[id];const gram=g.startsWith("grammar: ");return `<div class="gl-item"><div class="gl-w" lang="ja">${esc(w)}${r?`<span class="gl-r">${esc(r)}</span>`:""}</div><div class="${gram?"gl-g":"gl-m"}">${esc(gram?"Grammar: "+g.slice(9):g)}</div></div>`}).join("")}
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="gl-credit">Dictionary: JMdict (EDRDG, CC BY-SA 4.0) + Kikitori notes</span><button class="btn" data-act="closeSheet">Close</button></div></div></div>`}
function readingOf(ruby){return ruby.replace(/\[([^|\]]+)\|([^\]]+)\]/g,"$2")}
const PUNCT=/[\s、。！？!?,.・「」『』（）()…ー〜~‘’“”"']/;
function cmpChars(str){return [...str].map((c,i)=>({c,i,k:kata2hira(c.normalize("NFKC"))})).filter(x=>!PUNCT.test(x.c)||x.c==="ー")}
function lcsMatch(a,b){const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){hit[j]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return {hit,score:dp[0][0]}}
function gradeLine(input,ruby){const u=cmpChars(input).map(x=>x.k);let best=null;
  for(const target of [plain(ruby),readingOf(ruby)]){const tc=cmpChars(target);if(!tc.length)continue;const {hit,score}=lcsMatch(u,tc.map(x=>x.k));
    const extra=Math.max(0,u.length-score);const pct=Math.max(0,Math.round((score-extra*0.5)/tc.length*100));
    if(!best||pct>best.pct){const miss=new Set(tc.filter((x,j)=>!hit[j]).map(x=>x.i));
      best={pct,html:[...target].map((c,i)=>miss.has(i)?`<mark>${esc(c)}</mark>`:esc(c)).join("")}}}
  return best||{pct:0,html:""}}

  <h2 style="margin-top:8px">Everyday situations</h2>
  <div class="list">${core.map(lessonItem).join("")}</div>
  <button class="btn" data-act="openShadow" data-src="l1">Open shadowing studio</button></div>`}

function startLesson(id){const L=LMAP[id];
  const mk=o=>{const order=shuffle(o.map((_,i)=>i));return order};
  return {type:"lesson",id,step:0,plays:0,gOrder:mk(L.gist.o),gAns:null,dOrders:L.detail.map(d=>mk(d.o)),dAns:{},dict:{},rate:{},showEn:false,trb:{},finished:false}}

const STEPN=["Predict","Gist","Details","Dictation","Transcript","Reflect"];
function vLesson(){const s=V.sub,L=LMAP[s.id];
  const head=`<div class="row" style="justify-content:space-between"><button class="back" data-act="tab" data-k="lessons">← Lessons</button><span class="eyebrow">${s.finished?"Done":STEPN[s.step]}</span></div>
  <div class="steps">${STEPN.map((_,i)=>`<i class="${i<=s.step?"on":""}"></i>`).join("")}</div>
  <div><h1>${esc(L.jp)}</h1><div class="muted">${esc(L.en)} · <span class="tag">${L.reg}</span></div></div>`;
  let body="";
  const playBlock=(lbl)=>`<div class="card stack center"><button class="playbtn" id="pa" data-act="playAll" aria-label="Play">▶</button><div class="muted" style="font-size:14px">${lbl}</div>${speedBar()}</div>`;
  if(s.finished){body=finishedView(s,L)}
  else if(s.step===0){body=`<div class="card stack"><div class="eyebrow">Situation</div><p style="margin:0">${esc(L.situation)}</p>
    <div class="eyebrow">Keywords you'll hear</div><div class="kw">${L.kw.map(k=>`<span>${rb(k[0])}<small>${esc(k[1])}</small></span>`).join("")}</div></div>
    <div class="card"><b>Before you play it:</b> guess two or three things they'll say. You'll check your guess after the first listen.</div>
    <button class="btn primary big" data-act="step" data-n="1">I've made my guess → Listen</button>`}
  else if(s.step===1){const q=L.gist;body=`${playBlock(s.plays?`Played ${s.plays}×. Listen once more if you're unsure.`:"First listen. No text, just the overall idea.")}
    ${s.plays?`<div class="card q"><h3>${esc(q.q)}</h3>${s.gOrder.map(i=>`<button class="opt ${s.gAns!=null?(i===0?"right":(s.gAns===i?"wrong":"")):""}" data-act="gans" data-i="${i}" ${s.gAns!=null?"disabled":""}>${esc(q.o[i])}</button>`).join("")}
    ${s.gAns!=null?`<p class="fb ${s.gAns===0?"ok":"no"}" style="margin:4px 0 0">${s.gAns===0?"Right. Was it what you predicted?":"Not quite. Did your prediction steer you wrong? Listen for it next round."}</p>`:""}</div>`:""}
    ${s.gAns!=null?`<button class="btn primary big" data-act="step" data-n="2">Next: details</button>`:""}`}
  else if(s.step===2){const ans=Object.keys(s.dAns).length;body=`${playBlock("Second listen. Now catch the specifics.")}
    ${L.detail.map((d,qi)=>`<div class="card q"><h3>${esc(d.q)}</h3>${s.dOrders[qi].map(i=>{const a=s.dAns[qi];return `<button class="opt ${a!=null?(i===0?"right":(a===i?"wrong":"")):""}" data-act="dans" data-q="${qi}" data-i="${i}" ${a!=null?"disabled":""}>${esc(d.o[i])}</button>`}).join("")}</div>`).join("")}
    ${ans===L.detail.length?`<button class="btn primary big" data-act="step" data-n="3">Next: pinpoint dictation</button>`:""}`}
  else if(s.step===3){const whole=S.settings.dictMode==="line";body=`<div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Dictation mode"><button data-act="dmode" data-v="word" aria-pressed="${!whole}">One word</button><button data-act="dmode" data-v="line" aria-pressed="${whole}">Whole sentence</button></div></div>
    <p class="muted" style="margin:0">${whole?"Play the line and type the whole sentence in kana or kanji. 85% or higher counts as correct.":"Play the line and type the missing word in kana or kanji. Slow it down if you need to."}</p>${speedBar()}
    ${whole?L.dict.map((d,i)=>{const r=s.dict[i];return `<div class="card stack dict"><div class="row"><button class="btn" data-act="dplay" data-i="${i}">▶ Play line</button><span class="muted mono">${i+1}/${L.dict.length}</span></div>
    ${r?`<div class="fb ${r.ok?"ok":"no"}">${r.ok?"✓":"✗"} ${r.pct}% match</div><div class="muted" style="font-size:13px">You wrote: ${esc(r.val||"—")}</div><div class="diff" lang="ja">${r.html}</div><div class="muted" style="font-size:13px">Red marks the parts you missed.</div>`:
    `<textarea id="d${i}" autocomplete="off" autocapitalize="off" lang="ja" placeholder="聞こえた文を全部書く"></textarea><div class="row"><button class="btn primary" data-act="dcheck" data-i="${i}">Check</button></div>`}</div>`}).join(""):L.dict.map((d,i)=>{const r=s.dict[i];const txt=plain(L.lines[d.line][1]);const [pre,post]=[txt.slice(0,txt.indexOf(d.blank)),txt.slice(txt.indexOf(d.blank)+d.blank.length)];
    return `<div class="card stack dict"><div class="row"><button class="btn" data-act="dplay" data-i="${i}">▶ Play line</button><span class="muted mono">${i+1}/${L.dict.length}</span></div>
    <div class="sent">${esc(pre)}<span class="gap">${r?esc(d.blank):"&nbsp;"}</span>${esc(post)}</div>
    ${r?`<div class="fb ${r.ok?"ok":"no"}">${r.ok?"✓ Correct":"✗ You wrote “"+esc(r.val||"—")+"”. Answer: "+esc(d.ans.join(" / "))}</div>`:
    `<div class="row" style="flex-wrap:nowrap"><input id="d${i}" autocomplete="off" autocapitalize="off" lang="ja" placeholder="聞こえた言葉"><button class="btn primary" data-act="dcheck" data-i="${i}">Check</button></div>`}</div>`}).join("")}
    ${Object.keys(s.dict).length===L.dict.length?`<button class="btn primary big" data-act="step" data-n="4">Next: transcript</button>`:""}`}
  else if(s.step===4){body=`<p class="muted" style="margin:0">Read along while it plays. Tap any word for its meaning, or tap the speaker name to hear that line alone. Mark how well you caught each line. Shaky and lost lines go into Review.</p>
    ${L.notes?`<details class="card notes" open><summary><b>How it's really said</b> <span class="muted" style="font-size:13px">· spoken → textbook</span></summary><div class="ntable">${L.notes.map(n=>`<div class="nrow"><div class="nsp" lang="ja">${rb(n[0])}</div><div class="ntb" lang="ja">${esc(n[1])}</div><div class="nen">${esc(n[2])}</div></div>`).join("")}</div></details>`:""}
    <div class="lines" id="lines">${L.lines.map((x,i)=>`<div class="ln" data-act="line" data-i="${i}" data-line="${i}"><span class="sp">${esc(L.sp[x[0]])}</span><div><div class="t" lang="ja">${rbw(L.id+":"+i,x[1])}</div>${s.showEn?`<div class="e">${esc(x[2])}</div>`:""}
      <div class="rates">${[[1,"Got it"],[2,"Shaky"],[3,"Lost"]].map(([r,l])=>`<button data-act="rate" data-i="${i}" data-r="${r}" aria-pressed="${s.rate[i]==r}">${l}</button>`).join("")}</div></div></div>`).join("")}</div>
    <div class="sticky-ctl"><button class="btn primary" id="pa" data-act="playAll">▶ Play all</button>${furiBtn()}<button class="chip" data-act="en" aria-pressed="${s.showEn}">English</button><button class="btn" data-act="openShadow" data-src="${L.id}">Shadow it</button></div>
    ${speedBar()}
    <button class="btn primary big" data-act="step" data-n="5">Next: reflect</button>`}
  else if(s.step===5){const opts=[["speed","It was too fast"],["vocab","Words I didn't know"],["casual","Casual or contracted speech"],["lost","I lost track of the conversation"],["sounds","Couldn't tell certain sounds apart"],["easy","It felt easy"]];
    body=`<div class="card stack"><h3>What made this hard?</h3><p class="muted" style="margin:0">Pick everything that applies. The app uses this to pick your drills.</p><div class="row">${opts.map(([k,l])=>`<button class="chip" data-act="trb" data-k="${k}" aria-pressed="${!!s.trb[k]}">${l}</button>`).join("")}</div></div>
    <button class="btn primary big" data-act="finish">Finish lesson</button>`}
  return `<div class="stack">${head}${body}</div>`}

function lessonScore(s,L){let c=0,n=0;n++;if(s.gAns===0)c++;L.detail.forEach((_,i)=>{n++;if(s.dAns[i]===0)c++});L.dict.forEach((_,i)=>{n++;if(s.dict[i]?.ok)c++});return Math.round(c/n*100)}
function finishedView(s,L){const sc=S.done[L.id]?.score??lessonScore(s,L);const tk=Object.keys(s.trb).filter(k=>s.trb[k]);
  return `<div class="card stack center"><div class="eyebrow">Score</div><div class="mono" style="font-size:48px;line-height:1">${sc}%</div><p class="muted" style="margin:0">${s.addedN?s.addedN+" line"+(s.addedN>1?"s":"")+" added to Review.":"No lines added to Review."}</p></div>
  ${tk.map(k=>`<div class="card"><h3>${TIPS[k][0]}</h3><p class="muted" style="margin:6px 0 0">${TIPS[k][1]}</p></div>`).join("")}
  <div class="row"><button class="btn" data-act="openShadow" data-src="${L.id}">Shadow this lesson</button><button class="btn primary" data-act="tab" data-k="today">Back to today</button></div>`}

/* ===================== SHADOW ===================== */
const ROUNDS=[{n:1,l:"1 · Slow + script",rate:0.75,script:true},{n:2,l:"2 · Natural + script",rate:1,script:true},{n:3,l:"3 · Natural, no script",rate:1,script:false}];
function vShadow(){const s=V.sub,lines=srcLines(s.src),R=ROUNDS[s.round-1];
  return `<div class="stack"><div class="row" style="justify-content:space-between"><button class="back" data-act="back">← Back</button><span class="eyebrow">Shadowing studio</span></div>
  <div><h1>影の練習</h1><p class="muted" style="margin:4px 0 0">Speak along a beat behind the voice. After each line there's a pause for you to repeat it.</p></div>
  <select id="ssrc" aria-label="Material">${[...LESSONS,...STORIES].map(x=>`<option value="${x.id}" ${x.id===s.src?"selected":""}>${esc(x.jp)} · ${esc(x.en)}</option>`).join("")}</select>
  <div class="row" role="group" aria-label="Round">${ROUNDS.map(r=>`<button class="chip" data-act="round" data-n="${r.n}" aria-pressed="${s.round===r.n}">${r.l}</button>`).join("")}</div>
  <div class="row"><span class="muted" style="font-size:14px">Repeats per line</span>${[1,2,3].map(n=>`<button class="chip" data-act="reps" data-n="${n}" aria-pressed="${s.rep===n}">${n}×</button>`).join("")}</div>
  <div class="lines ${R.script?"":"hidden-script"}" id="lines">${lines.map((x,i)=>`<div class="ln" data-act="sline" data-i="${i}" data-line="${i}"><span class="sp">${esc(x.who)}</span><div><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="t" lang="ja" style="flex:1">${rbw(x.key,x.t)}</div><button class="star" data-act="star" data-k="${x.key}" aria-pressed="${!!S.review[x.key]}" aria-label="Add to review">★</button></div></div></div>`).join("")}</div>
  <div class="sticky-ctl"><button class="btn primary" id="pa" data-act="shadowGo">▶ Start round ${s.round}</button>${furiBtn()}</div>
  <p class="muted" style="font-size:13px;margin:0">Work up through the rounds over a few days. Round 3 trains your ear without the text as a crutch. Tap any line to loop just that one. ★ adds a line to Review.</p></div>`}

/* ===================== STORIES ===================== */
function vStories(){return `<div class="stack"><div><div class="eyebrow">Extensive listening</div><h1>物語</h1></div>${voiceWarn()}
  <button class="btn" data-act="openListen">🎧 Listen mode: play stories non-stop</button>
  <p class="muted" style="margin:0">Easy on purpose. The goal is lots of comfortable listening while you read along. Don't stop to study.</p>
  <div class="list">${STORIES.map(s=>`<button class="item" data-act="openStory" data-id="${s.id}"><span class="grow"><span class="jp">${esc(s.jp)}</span><br><span class="en">${esc(s.en)} · ${s.lines.length} sentences</span></span><span class="tag">${s.lv}</span>${S.done[s.id]?`<span class="score">✓</span>`:""}</button>`).join("")}</div></div>`}
function vStory(){const s=V.sub,St=SMAP[s.id];
  return `<div class="stack"><div class="row" style="justify-content:space-between"><button class="back" data-act="tab" data-k="stories">← Stories</button><span class="tag">${St.lv}</span></div>
  <div><h1>${esc(St.jp)}</h1><div class="muted">${esc(St.en)}</div></div>
  <div class="lines" id="lines">${St.lines.map((x,i)=>`<div class="ln" style="grid-template-columns:22px 1fr" data-act="stline" data-i="${i}" data-line="${i}"><button class="lplay" data-act="stline" data-i="${i}" aria-label="Play from here">▶</button><div><div class="t" lang="ja">${rbw(St.id+":"+i,x[0])}</div>${s.showEn?`<div class="e">${esc(x[1])}</div>`:""}</div></div>`).join("")}</div>
  <div class="sticky-ctl"><button class="btn primary" id="pa" data-act="storyPlay">▶ Play from start</button>${furiBtn()}<button class="chip" data-act="sen" aria-pressed="${s.showEn}">English</button></div>
  ${speedBar()}</div>`}

/* ===================== DRILLS ===================== */
const DRILLS={pairs:["音の区別","Sound pairs","Long vowels, small っ and ん. Hear one word, pick which it was."],
 casual:["縮約形","Contractions","Hear casual speech, pick the full form it's short for."],
 rough:["荒い言葉","Rough & slurred","Yankii, yakuza and slurred speech. Hear it, pick what it means in standard Japanese."],
 nums:["数字と時間","Numbers & times","Prices, times, dates and counters. Type what you hear."]};
function vDrills(){return `<div class="stack"><div><div class="eyebrow">Bottom-up ear training</div><h1>耳トレ</h1></div>${voiceWarn()}
  <div class="list">${Object.entries(DRILLS).map(([k,d])=>`<button class="item" data-act="openDrill" data-k="${k}"><span class="grow"><span class="jp">${d[0]}</span><br><span class="en"><b>${d[1]}.</b> ${d[2]}</span></span>${S.drills[k]!=null?`<span class="score">${S.drills[k]}%</span>`:""}</button>`).join("")}</div>
  <button class="btn" data-act="openShadow" data-src="l1">Shadowing studio</button></div>`}

function genDrill(kind){const N=10;let q=[];
  if(kind==="pairs"){for(let i=0;i<N;i++){const p=pick(PAIRS);const w=Math.random()<.5?0:1;q.push({say:p[w][0],opts:shuffle([0,1]).map(j=>({l:p[j][1],s:p[j][2],ok:j===w}))})}}
  else if(kind==="casual"||kind==="rough"){shuffle(kind==="rough"?ROUGH:CASUAL).slice(0,N).forEach(c=>{q.push({say:c[0],show:c[0],opts:shuffle([1,2,3]).map(j=>({l:c[j],ok:j===1}))})})}
  else{q=shuffle(NUMS).slice(0,N).map(x=>({say:x.say,num:true,ans:x.ans,hint:x.hint}))}
  return {type:"drill",kind,q,i:0,score:0,ans:null,inp:""}}
function vDrill(){const s=V.sub,D=DRILLS[s.kind];
  const head=`<div class="row" style="justify-content:space-between"><button class="back" data-act="tab" data-k="drills">← Drills</button><span class="eyebrow mono">${Math.min(s.i+1,s.q.length)}/${s.q.length}</span></div>
  <div class="steps">${s.q.map((_,i)=>`<i class="${i<s.i||(i===s.i&&s.ans!=null)?"on":""}"></i>`).join("")}</div><div><h1>${D[0]}</h1><div class="muted">${D[1]}</div></div>`;
  if(s.i>=s.q.length){const pc=Math.round(s.score/s.q.length*100);
    return `<div class="stack">${head}<div class="card stack center"><div class="eyebrow">Score</div><div class="mono" style="font-size:48px;line-height:1">${pc}%</div><p class="muted" style="margin:0">${pc>=90?"Strong. Try it at Fast speed next time.":pc>=60?"Good. Repeat this drill tomorrow.":"These sounds are new to your ear. A few short rounds a day works better than one long one."}</p></div>
    <div class="row"><button class="btn" data-act="openDrill" data-k="${s.kind}">Go again</button><button class="btn primary" data-act="tab" data-k="today">Back to today</button></div></div>`}
  const q=s.q[s.i];
  let body=`<div class="card stack center"><button class="playbtn" id="pa" data-act="dqplay" aria-label="Play">▶</button><div class="muted" style="font-size:14px">${q.num?esc(q.hint):s.kind==="pairs"?"Which word did you hear?":s.kind==="rough"?"What does it mean in standard Japanese?":"What's the full form?"}</div>${speedBar()}</div>`;
  if(q.num){const r=s.ans;
    body+=`<div class="card stack">${r==null?`<div class="row" style="flex-wrap:nowrap"><input id="nin" inputmode="decimal" autocomplete="off" placeholder="Type the number" class="mono" style="flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:20px"><button class="btn primary" data-act="ncheck">Check</button></div>`:
    `<div class="fb ${r?"ok":"no"}">${r?"✓ Correct":"✗ You typed “"+esc(s.inp||"—")+"”"}</div><div class="big-jp" lang="ja">${esc(q.say)}</div>`}</div>`}
  else{body+=`<div class="card q">${q.show&&s.ans!=null?`<div class="big-jp" lang="ja">${esc(q.show)}</div>`:""}${q.opts.map((o,i)=>`<button class="opt ${s.ans!=null?(o.ok?"right":(s.ans===i?"wrong":"")):""}" data-act="qans" data-i="${i}" ${s.ans!=null?"disabled":""}><span lang="ja" style="font-size:19px">${esc(o.l)}</span>${o.s?` <span class="muted" style="font-size:13px">${esc(o.s)}</span>`:""}</button>`).join("")}</div>`}
  if(s.ans!=null)body+=`<button class="btn primary big" data-act="dnext">${s.i+1<s.q.length?"Next":"See score"}</button>`;
  return `<div class="stack">${head}${body}</div>`}

/* ===================== REVIEW ===================== */
const IV=[0,1,2,4,8,16,32,64];
function vReview(){const s=V.sub&&V.sub.type==="review"?V.sub:null;const due=dueKeys();
  const total=Object.keys(S.review).length;
  if(!s){return `<div class="stack"><div><div class="eyebrow">Spaced repetition</div><h1>復習</h1></div>
    <div class="card"><div class="stats" style="grid-template-columns:1fr 1fr"><div><div class="mono" style="font-size:28px">${due.length}</div><div class="muted" style="font-size:13px">due now</div></div><div><div class="mono" style="font-size:28px">${total}</div><div class="muted" style="font-size:13px">lines saved</div></div></div></div>
    ${due.length?`<button class="btn primary big" data-act="revStart">Start review</button>`:`<div class="card"><b>All caught up.</b><p class="muted" style="margin:6px 0 0">Lines you mark Shaky or Lost in a lesson, miss in dictation, or ★ in the shadowing studio come back here: tomorrow first, then at longer gaps as you get them.</p></div>`}
    <p class="muted" style="font-size:13px;margin:0">How it works: listen first with no text. Try to understand it, then reveal and rate yourself honestly.</p></div>`}
  if(s.i>=s.queue.length){markTask("review");return `<div class="stack"><div><div class="eyebrow">Spaced repetition</div><h1>復習</h1></div><div class="card stack center"><div class="mono" style="font-size:44px;line-height:1">${s.queue.length}</div><p class="muted" style="margin:0">lines reviewed. See you tomorrow.</p></div><button class="btn primary" data-act="revExit">Done</button></div>`}
  const k=s.queue[s.i],ln=lineByKey(k);
  return `<div class="stack"><div class="row" style="justify-content:space-between"><button class="back" data-act="revExit">← Review</button><span class="eyebrow mono">${s.i+1}/${s.queue.length}</span></div>
  <div class="steps">${s.queue.map((_,i)=>`<i class="${i<s.i?"on":""}"></i>`).join("")}</div>
  <div class="card stack center"><div class="eyebrow">${esc(srcName(k.split(":")[0]))}</div><button class="playbtn" id="pa" data-act="revPlay" aria-label="Play">▶</button>${speedBar()}</div>
  ${s.rev?`<div class="card stack"><div class="big-jp" lang="ja" style="text-align:left">${rbw(k,ln.t)}</div><div class="muted">${esc(ln.e)}</div><div class="row">${furiBtn()}</div></div>
  <div class="row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${[["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]].map(([r,l])=>`<button class="btn" data-act="revRate" data-r="${r}">${l}</button>`).join("")}</div>`
  :`<button class="btn primary big" data-act="revShow">Reveal text</button>`}</div>`}
function addReview(k){if(!S.review[k])S.review[k]={box:0,due:Date.now()+12*3600e3};save()}

/* ===================== PLAYBACK HOOKS ===================== */
function hl(i,cls="now"){document.querySelectorAll("#lines .ln").forEach(e=>e.classList.remove("now","turn"));const el=document.querySelector(`#lines [data-line="${i}"]`);if(el){el.classList.add(cls);if(cls==="now")el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}}
function clearHl(){document.querySelectorAll("#lines .ln").forEach(e=>e.classList.remove("now","turn"))}
function setPA(on,label){const b=document.getElementById("pa");if(!b)return;if(!b.dataset.label)b.dataset.label=b.textContent;
  if(b.classList.contains("playbtn")){b.classList.toggle("stop",on);b.textContent=on?"■":"▶"}else b.textContent=on?"■ Stop":(label||b.dataset.label)}
async function run(items,opt={},after){if(TTS.busy){TTS.stop();setPA(false);clearHl();return}
  setPA(true);const ok=await TTS.seq(items,opt);setPA(false);clearHl();if(ok&&after)after()}

/* ===================== ACTIONS ===================== */
const ACT={
 gloss:b=>openGloss(b),
 dmode:b=>{S.settings.dictMode=b.dataset.v;save();if(V.sub)V.sub.dict={};render()},
 openListen:()=>{const prev=V.sub&&V.sub.type!=="listen"?{tab:V.tab,sub:V.sub}:null;TTS.stop();V={tab:V.tab,sub:{type:"listen",prev}};render();scrollTo(0,0)},
 lstart:()=>{lpStart();render()},
 lc:b=>{LCTL[b.dataset.k]();},
 lpeek:()=>{if(V.sub){V.sub.peek=true;updateNow()}},
 lopt:b=>{const L=lset(),o=b.dataset.o,v=b.dataset.v;L[o]=o==="rep"?+v:o==="loop"?v==="true":v;save();render()},
 lquick:b=>{const L=lset(),q=b.dataset.q;const src=listenSources();
   L.sel=q==="none"?[]:q==="all"?src.flatMap(x=>x[1].map(y=>y.id)):q==="stories"?STORIES.map(x=>x.id):LESSONS.filter(l=>q==="real"?l.real:l.hard).map(l=>l.id);save();render()},
 tab:b=>{const k=b.dataset.k;go(k)},
 settings:()=>openSettings(),
 speed:b=>{S.settings.speed=+b.dataset.v;save();document.querySelectorAll(".spd").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v==b.dataset.v))},
 furi:b=>{S.settings.furi=!S.settings.furi;save();document.documentElement.classList.toggle("nofuri",!S.settings.furi);document.querySelectorAll('[data-act="furi"]').forEach(x=>x.setAttribute("aria-pressed",S.settings.furi))},
 openLesson:b=>go("lessons",startLesson(b.dataset.id)),
 openStory:b=>go("stories",{type:"story",id:b.dataset.id,showEn:false,max:-1}),
 openDrill:b=>go("drills",genDrill(b.dataset.k)),
 openShadow:b=>{const prev=V.sub&&V.sub.type!=="shadow"?{tab:V.tab,sub:V.sub}:null;TTS.stop();V={tab:V.tab,sub:{type:"shadow",src:b.dataset.src,round:1,rep:1,prev}};render();scrollTo(0,0)},
 back:()=>{const p=V.sub&&V.sub.prev;TTS.stop();if(p){V={tab:p.tab,sub:p.sub};render();scrollTo(0,0)}else go(V.tab)},
 step:b=>{TTS.stop();V.sub.step=+b.dataset.n;render();scrollTo(0,0)},
 playAll:()=>{const s=V.sub,L=LMAP[s.id];const items=L.lines.map(x=>({text:plain(x[1]),sp:x[0]}));
   run(items,{onLine:i=>{if(s.step===4)hl(i)}},()=>{if(s.step===1){s.plays++;render()}})},
 gans:b=>{V.sub.gAns=+b.dataset.i;render()},
 dans:b=>{V.sub.dAns[+b.dataset.q]=+b.dataset.i;render()},
 dplay:b=>{const L=LMAP[V.sub.id],d=L.dict[+b.dataset.i],x=L.lines[d.line];if(TTS.busy){TTS.stop();return}TTS.seq([{text:plain(x[1]),sp:x[0]}])},
 dcheck:b=>{const i=+b.dataset.i,L=LMAP[V.sub.id],d=L.dict[i];const val=(document.getElementById("d"+i)||{}).value||"";
   if(S.settings.dictMode==="line"){const g=gradeLine(val,L.lines[d.line][1]);const ok=g.pct>=85;V.sub.dict[i]={val,ok,pct:g.pct,html:g.html};if(!ok)V.sub.rate[d.line]=Math.max(V.sub.rate[d.line]||0,2);render();return}
   const ok=d.ans.some(a=>norm(a)===norm(val));V.sub.dict[i]={val,ok};if(!ok)V.sub.rate[d.line]=Math.max(V.sub.rate[d.line]||0,2);render()},
 line:(b,e)=>{if(e.target.closest(".rates"))return;const L=LMAP[V.sub.id],i=+b.dataset.i,x=L.lines[i];TTS.stop();setPA(false);hl(i);TTS.seq([{text:plain(x[1]),sp:x[0]}]).then(ok=>{if(ok)clearHl()})},
 rate:b=>{const i=+b.dataset.i,r=+b.dataset.r;V.sub.rate[i]=V.sub.rate[i]==r?0:r;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",V.sub.rate[i]==x.dataset.r))},
 en:()=>{V.sub.showEn=!V.sub.showEn;TTS.stop();render()},
 trb:b=>{const k=b.dataset.k;V.sub.trb[k]=!V.sub.trb[k];b.setAttribute("aria-pressed",V.sub.trb[k])},
 finish:()=>{const s=V.sub,L=LMAP[s.id];const sc=lessonScore(s,L);S.done[L.id]={date:dkey(),score:sc};
   Object.keys(s.trb).forEach(k=>{if(s.trb[k])S.trouble[k]=(S.trouble[k]||0)+1});
   let n=0;Object.entries(s.rate).forEach(([i,r])=>{if(r>=2){const k=L.id+":"+i;if(!S.review[k])n++;addReview(k)}});
   s.addedN=n;s.finished=true;markTask("lesson");save();render();scrollTo(0,0)},
 round:b=>{TTS.stop();V.sub.round=+b.dataset.n;render()},
 reps:b=>{V.sub.rep=+b.dataset.n;document.querySelectorAll('[data-act="reps"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.n==b.dataset.n))},
 shadowGo:()=>{const s=V.sub,R=ROUNDS[s.round-1];const lines=srcLines(s.src);
   run(lines.map(x=>({text:plain(x.t),sp:x.sp})),{rate:R.rate,shadow:true,repeat:s.rep,onLine:i=>hl(i),onTurn:i=>hl(i,"turn")})},
 sline:(b,e)=>{if(e.target.closest(".star"))return;const s=V.sub,R=ROUNDS[s.round-1],x=srcLines(s.src)[+b.dataset.i];const i=+b.dataset.i;
   TTS.stop();setPA(false);TTS.seq([{text:plain(x.t),sp:x.sp}],{rate:R.rate,shadow:true,repeat:Math.max(2,s.rep),onLine:()=>hl(i),onTurn:()=>hl(i,"turn")}).then(ok=>{if(ok)clearHl()})},
 star:b=>{const k=b.dataset.k;if(S.review[k])delete S.review[k];else S.review[k]={box:0,due:Date.now()};save();b.setAttribute("aria-pressed",!!S.review[k]);render()},
 storyPlay:()=>{const s=V.sub,St=SMAP[s.id];playStoryFrom(0)},
 stline:b=>{playStoryFrom(+b.dataset.i)},
 sen:()=>{V.sub.showEn=!V.sub.showEn;TTS.stop();render()},
 dqplay:()=>{const q=V.sub.q[V.sub.i];if(TTS.busy){TTS.stop();setPA(false);return}run([{text:q.say,sp:"A"}])},
 qans:b=>{const s=V.sub,q=s.q[s.i];s.ans=+b.dataset.i;if(q.opts[s.ans].ok)s.score++;render()},
 ncheck:()=>{const s=V.sub,q=s.q[s.i];const v=(document.getElementById("nin")||{}).value||"";const dig=v.normalize("NFKC").replace(/\D/g,"");
   const ok=q.ans.includes(dig);s.ans=ok;s.inp=v;if(ok)s.score++;render()},
 dnext:()=>{const s=V.sub;TTS.stop();s.i++;s.ans=null;s.inp="";if(s.i>=s.q.length){S.drills[s.kind]=Math.round(s.score/s.q.length*100);markTask("drill")}render()},
 revStart:()=>{V.sub={type:"review",queue:dueKeys().slice(0,20),i:0,rev:false};render()},
 revPlay:()=>{const ln=lineByKey(V.sub.queue[V.sub.i]);run([{text:plain(ln.t),sp:ln.sp}])},
 revShow:()=>{V.sub.rev=true;render()},
 revRate:b=>{const s=V.sub,k=s.queue[s.i],it=S.review[k]||{box:0},r=b.dataset.r;
   if(r==="again"){it.box=0;it.due=Date.now()+10*60e3}
   else{if(r==="good")it.box=Math.min(it.box+1,IV.length-1);if(r==="easy")it.box=Math.min(it.box+2,IV.length-1);if(r==="hard")it.box=Math.max(it.box,1);
     const days=r==="hard"?1:IV[it.box]||1;it.due=Date.now()+days*864e5-3600e3}
   S.review[k]=it;save();TTS.stop();s.i++;s.rev=false;render();scrollTo(0,0)},
 revExit:()=>{TTS.stop();V.sub=null;render()},
 closeSheet:()=>closeSettings(),
 testVoice:()=>{TTS.seq([{text:"こんにちは。今日も聞き取りの練習をしましょう。",sp:"A"},{text:"はい、がんばります。",sp:"B"}])},
 resetAsk:b=>{b.hidden=true;document.getElementById("resetYes").hidden=false},
 resetYes:()=>{S=structuredClone(DEF);save();closeSettings();go("today")}
};
function playStoryFrom(start){const s=V.sub,St=SMAP[s.id];const items=St.lines.slice(start).map(x=>({text:plain(x[0]),sp:"A"}));
  run(items,{gap:500,onLine:i=>{const idx=start+i;hl(idx);if(idx>s.max)s.max=idx;if(s.max>=St.lines.length*0.7-1&&!S.done[St.id]){S.done[St.id]={date:dkey()};markTask("story")}}},()=>{S.done[St.id]={date:dkey()};markTask("story")})}

/* ===================== SETTINGS ===================== */
function openSettings(){sheetOpen=true;
  $("#sheet").innerHTML=`<div class="sheet" data-act="closeSheet"><div class="panel stack" role="dialog" aria-label="Settings" onclick="event.stopPropagation()">
  <div class="row" style="justify-content:space-between"><h2>Settings</h2><button class="iconbtn" data-act="closeSheet" aria-label="Close">✕</button></div>
  <p class="muted" style="margin:0;font-size:13px">All audio is built into the app and doesn't depend on your phone's voice settings. If you hear nothing, check that the phone isn't on silent and the volume is up.</p>
  <div class="row"><button class="btn" data-act="testVoice">▶ Test sound</button></div>
  <div class="stack" style="gap:6px"><span class="eyebrow">Default speed</span>${speedBar()}</div>
  <div class="row">${furiBtn()}</div>
  <p class="muted" style="margin:0;font-size:13px">Progress is saved in this browser on this device.</p>
  <div class="row"><button class="btn ghost" data-act="resetAsk">Reset all progress</button><button class="btn" id="resetYes" data-act="resetYes" hidden style="color:var(--bad);border-color:var(--bad)">Yes, erase everything</button></div>
  </div></div>`;
  }
function closeSettings(){sheetOpen=false;$("#sheet").innerHTML="";document.querySelectorAll(".w.sel").forEach(x=>x.classList.remove("sel"))}

/* ===================== WIRING ===================== */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;if(b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b,e)});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.pick){const L=lset(),id=e.target.dataset.pick;L.sel=L.sel.filter(x=>x!==id);if(e.target.checked)L.sel.push(id);save();const n=buildPlaylist().length;const btn=document.querySelector('[data-act="lstart"]');if(btn){btn.textContent="▶ Play "+n+" lines";btn.disabled=!n}return}if(e.target.id==="ssrc"){TTS.stop();V.sub.src=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input")){if(e.target.id==="nin")ACT.ncheck();else if(/^d\d+$/.test(e.target.id))ACT.dcheck({dataset:{i:e.target.id.slice(1)}})}if(e.key==="Escape"&&sheetOpen)closeSettings()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)TTS.stop()});
window.appBack=function(){if(sheetOpen){closeSettings();return true}if(V.sub){if(V.sub.type==="shadow"){ACT.back();return true}if(V.sub.type==="review"){ACT.revExit();return true}go(V.tab);return true}if(V.tab!=="today"){go("today");return true}return false};
TTS.init();
if(NATIVE){try{const st=JSON.parse(NATIVE.state()||"{}");if(st.active){LP.active=true;LP.playing=!!st.playing;LP.idx=st.index||0;LP.nat=st}}catch(e){}}
render();
</script>

</body></html>
